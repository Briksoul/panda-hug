# Panda Hug V11 - /pandahug/ 路径部署
# 放到 /etc/nginx/conf.d/pandahug-v11.conf

# 后端 API 反向代理
location /pandahug/api/ {
    proxy_pass http://127.0.0.1:5001/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
}

# 前端静态文件
location /pandahug/ {
    alias /opt/pandahug-v11/;
    try_files $uri $uri/ /pandahug/index.html;
    index index.html;
}
